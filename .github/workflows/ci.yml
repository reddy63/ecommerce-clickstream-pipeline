name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Check formatting with black
        run: black --check --diff .

      - name: Check import ordering with isort
        run: isort --check-only --diff .

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=venv,.git,__pycache__ \
            --count --statistics

  dbt-validation:
    name: dbt Model Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arun
          POSTGRES_PASSWORD: arun
          POSTGRES_DB: clickstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-postgres
        run: pip install dbt-postgres==1.7.0

      - name: Write dbt profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          clickstream:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: arun
                password: arun
                dbname: clickstream_db
                schema: public
                threads: 1
          PROFILE

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt compile (parse + validate SQL)
        working-directory: dbt_project
        run: dbt compile --profiles-dir ~/.dbt

  schema-validation:
    name: Data Contract Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema pyyaml

      - name: Validate JSON schemas
        run: |
          python - << 'PYEOF'
          import json, os, sys
          schema_dir = "data_governance/schemas"
          errors = []
          for f in os.listdir(schema_dir):
              if f.endswith(".json"):
                  path = os.path.join(schema_dir, f)
                  try:
                      with open(path) as fh:
                          json.load(fh)
                      print(f"  OK  {f}")
                  except json.JSONDecodeError as e:
                      errors.append(f"  FAIL {f}: {e}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("All schemas valid.")
          PYEOF

      - name: Validate data contracts YAML
        run: |
          python - << 'PYEOF'
          import yaml, os, sys
          contract_dir = "data_governance/data_contracts"
          errors = []
          for f in os.listdir(contract_dir):
              if f.endswith(".yml") or f.endswith(".yaml"):
                  path = os.path.join(contract_dir, f)
                  try:
                      with open(path) as fh:
                          yaml.safe_load(fh)
                      print(f"  OK  {f}")
                  except yaml.YAMLError as e:
                      errors.append(f"  FAIL {f}: {e}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("All contracts valid.")
          PYEOF
