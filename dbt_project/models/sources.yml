version: 2

sources:
  - name: raw
    description: "Raw data loaded by Spark gold_to_postgres.py into the analytics database"
    database: analytics
    schema: public
    tables:
      - name: clickstream_metrics
        description: "Aggregated clickstream metrics from Spark Gold layer"
        columns:
          - name: category
            description: "Product category from Fake Store API"
          - name: event_date
            description: "Date of the events"
          - name: total_events
            description: "Count of events per category per day"
          - name: total_revenue
            description: "Sum of prices per category per day"
        freshness:
          warn_after:
            count: 2
            period: hour
          error_after:
            count: 12
            period: hour
        loaded_at_field: "event_date::timestamp"
